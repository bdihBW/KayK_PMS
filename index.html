<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b0613f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self' blob: https://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="KayK Workbench, a Personal Management System for meetings, projects, tasks, documents and reminders.">
<title>KayK Workbench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23b0613f%22/%3E%3Cg%20fill%3D%22none%22%20stroke-width%3D%228%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%2014v36%22%20stroke%3D%22%23fff%22/%3E%3Cpath%20d%3D%22M22%2034L42%2014%22%20stroke%3D%22%23fff%22/%3E%3Cpath%20d%3D%22M28%2036l10%2013%2016-23%22%20stroke%3D%22%23e39a2e%22/%3E%3C/g%3E%3C/svg%3E" type="image/svg+xml">
<style>
:root{
  color-scheme:light;
  --surface-000:#f7f3ee;--surface-100:#ffffff;--surface-200:#f1ebe4;--line:#e5ddd3;--line-strong:#8a7c70;
  --ink:#2a211b;--ink-muted:#6b5d52;--brand:#b0613f;--brand-strong:#8f4b2f;--on-brand:#ffffff;--brand-tint:#f6e8e0;--brand-ink:#974d2f;
  --olive:#7f8050;--olive-deep:#737649;--success-ink:#565933;--success-tint:#eeeedf;
  --amber:#e39a2e;--on-amber:#2a1a05;--warning-ink:#85540c;--warning-tint:#fbefd9;
  --danger:#9e2a2b;--on-danger:#ffffff;--danger-tint:#f8e3e1;--focus:#8f4b2f;
  --rail-bg:#241c17;--rail-ink:#f1e8de;--rail-muted:#b8a99b;--rail-hover:#30261f;--rail-active:#3f3028;--rail-line:#3b2f28;
  --shadow-float:0 10px 28px rgba(42,33,27,.18);--shadow-card:0 1px 2px rgba(42,33,27,.06);
  --font-sans:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-serif:"Times New Roman",Times,Georgia,serif;
  --font-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;
  --radius-sm:4px;--radius-md:6px;--radius-lg:10px;--radius-pill:999px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --surface-000:#171412;--surface-100:#201c19;--surface-200:#2a2521;--line:#3a332d;--line-strong:#8a7c70;
  --ink:#f3ece5;--ink-muted:#b8aa9d;--brand:#d98a66;--brand-strong:#e9a98a;--on-brand:#1e120c;--brand-tint:#3b261c;--brand-ink:#e3a07f;
  --olive-deep:#a9ab78;--success-ink:#b9bb86;--success-tint:#2a2b1d;--warning-ink:#eab15a;--warning-tint:#3a2a12;
  --danger:#f08a80;--on-danger:#2a0d0b;--danger-tint:#3d1e1c;--focus:#e9a98a;
  --rail-bg:#100c0a;--rail-hover:#1c1613;--rail-active:#2a201b;--rail-line:#2a221d;
  --shadow-float:0 10px 28px rgba(0,0,0,.55);--shadow-card:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-000:#171412;--surface-100:#201c19;--surface-200:#2a2521;--line:#3a332d;--line-strong:#8a7c70;
  --ink:#f3ece5;--ink-muted:#b8aa9d;--brand:#d98a66;--brand-strong:#e9a98a;--on-brand:#1e120c;--brand-tint:#3b261c;--brand-ink:#e3a07f;
  --olive-deep:#a9ab78;--success-ink:#b9bb86;--success-tint:#2a2b1d;--warning-ink:#eab15a;--warning-tint:#3a2a12;
  --danger:#f08a80;--on-danger:#2a0d0b;--danger-tint:#3d1e1c;--focus:#e9a98a;
  --rail-bg:#100c0a;--rail-hover:#1c1613;--rail-active:#2a201b;--rail-line:#2a221d;
  --shadow-float:0 10px 28px rgba(0,0,0,.55);--shadow-card:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface-000);color:var(--ink);font:15px/22px var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--brand-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:600 11px/16px var(--font-sans);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-100);color:var(--ink-muted)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--rail-bg);color:var(--rail-ink);display:flex;flex-direction:column;padding:16px 12px 14px}
.rail :focus-visible{outline-color:var(--amber)}
.rail .mark{display:block;padding:2px 8px 14px}
.rail .mark svg{height:34px;width:auto;display:block}
.rail-actions{display:flex;gap:6px;margin:0 4px 10px;position:relative}
.rail-actions .btn-primary{flex:1}
.rail-search{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border-radius:var(--radius-md);background:var(--rail-hover);border:1px solid var(--rail-line);color:var(--rail-muted);cursor:pointer}
.rail-search:hover{color:var(--rail-ink)}
.rail kbd{background:transparent;border-color:var(--rail-line);color:var(--rail-muted)}
.nav-group{margin-top:12px}
.nav-label{font-size:11px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-muted);padding:0 12px 4px}
.nav a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 10px 0 12px;border-radius:var(--radius-md);color:var(--rail-ink);text-decoration:none;font-size:14px;font-weight:500}
.nav a .ic{color:var(--rail-muted)}
.nav a:hover{background:var(--rail-hover)}
.nav a.on{background:var(--rail-active);color:#fff;font-weight:600}
.nav a.on .ic{color:var(--amber)}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;color:var(--rail-muted);font-variant-numeric:tabular-nums}
.nav .count.alert{background:var(--amber);color:var(--on-amber);border-radius:var(--radius-pill);padding:0 7px;line-height:20px;font-weight:700}
.rail-panel{margin:16px 4px 0;padding:12px;border:1px solid var(--rail-line);border-radius:var(--radius-lg)}
.rail-panel h3{margin:0 0 6px;font-size:11px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-muted)}
.rail-stat{display:flex;justify-content:space-between;gap:8px;font-size:13px;line-height:26px;color:var(--rail-ink);text-decoration:none;border-radius:4px;padding:0 4px;margin:0 -4px}
.rail-stat:hover{background:var(--rail-hover)}
.rail-stat b{font-variant-numeric:tabular-nums}
.rail-stat.warn b{color:#f4a596}
.rail-act{display:block;width:100%;text-align:left;padding:7px 4px;margin:0 -4px;width:calc(100% + 8px);border:0;border-top:1px solid var(--rail-line);background:none;font-size:12px;line-height:16px;color:var(--rail-muted);cursor:pointer;border-radius:0}
.rail-act:first-of-type{border-top:0}
.rail-act:hover{background:var(--rail-hover)}
.rail-act b{display:block;color:var(--rail-ink);font-weight:600;font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-link{display:block;margin-top:6px;font-size:12px;color:var(--amber);text-decoration:none}
.rail-foot{margin-top:auto;padding-top:14px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--rail-muted);padding:8px 8px 0}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.sync.on i{background:#a8c47f}
.main{min-width:0;padding:0 32px 120px}
.inner{max-width:1200px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;justify-content:space-between;min-height:60px;background:var(--surface-000);border-bottom:1px solid var(--line);margin:0 -32px 24px;padding:0 32px}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;line-height:18px;color:var(--ink-muted);min-width:0}
.crumbs a{color:var(--ink-muted);text-decoration:none}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .tile{display:none}
.topbar-right{display:flex;gap:8px;align-items:center}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface-100);border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:0 6px 0 10px;min-height:38px;color:var(--ink-muted)}
.searchbox input{border:0;background:none;outline:none;min-width:0;width:220px;color:var(--ink)}
.searchbox:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.mode-chip{font-size:12px;line-height:18px;font-weight:600;padding:3px 10px;border-radius:var(--radius-pill);background:var(--warning-tint);color:var(--warning-ink);text-decoration:none;white-space:nowrap}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.page-head h1{margin:0;font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.01em}
.page-head .sub{color:var(--ink-muted);font-size:14px;line-height:20px;margin-top:2px}
.top-actions{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.bottom{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding:0 16px 160px}
  .topbar{margin:0 -16px 16px;padding:0 16px;min-height:56px}
  .crumbs .tile{display:block;width:30px;height:30px;flex:none}
  .crumbs .path{display:none}
  .searchbox{display:none}
  .page-head h1{font-size:23px;line-height:28px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface-100);border-top:1px solid var(--line)}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;line-height:14px;font-weight:600;color:var(--ink-muted);text-decoration:none;min-height:44px}
  .bottom a.on{color:var(--brand-ink)}
  .fab-wrap{display:flex!important}
}
.icon-btn.icon-only{display:none}
@media (max-width:900px){.icon-btn.icon-only{display:inline-flex}}
.banner{display:flex;gap:var(--space-3);align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warning-tint);color:var(--warning-ink);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);font-size:14px;line-height:20px}
.banner.err{background:var(--danger-tint);color:var(--danger)}
.banner.info{background:var(--brand-tint);color:var(--brand-ink)}

/* ---------- blocks ---------- */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:20px;align-items:start}
.grid-2{display:grid;gap:20px;grid-template-columns:minmax(0,3fr) minmax(0,2fr);margin-bottom:20px;align-items:start}
@media (max-width:1100px){.grid-2{grid-template-columns:1fr}}
.card{background:var(--surface-100);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-card);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);padding:12px 16px;border-bottom:1px solid var(--line);min-height:52px}
.card-head h2{margin:0;font-size:15px;line-height:20px;font-weight:650}
.card-head .hsub{font-size:13px;color:var(--ink-muted);font-weight:400;margin-left:6px}
.card-body{padding:var(--space-4)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:1300px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface-100);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;text-align:left;cursor:pointer;box-shadow:var(--shadow-card);min-width:0}
.stat:hover{border-color:var(--line-strong)}
.stat-label{font-size:13px;line-height:18px;font-weight:500;color:var(--ink-muted)}
.stat-value{font-size:28px;line-height:34px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.stat-hint{font-size:12px;line-height:16px;color:var(--ink-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.danger .stat-value{color:var(--danger)}
.stat.warn .stat-value{color:var(--warning-ink)}
.empty{padding:28px var(--space-4);color:var(--ink-muted);text-align:center}
.empty p{margin:0 0 var(--space-3)}
.welcome{background:var(--surface-100);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px}
.welcome h2{margin:0 0 6px;font-size:18px}
.welcome p{margin:0 0 16px;color:var(--ink-muted)}
.section{margin-bottom:var(--space-6)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);margin:0 0 var(--space-2)}
.section-title h2{margin:0;font-size:15px;line-height:22px;font-weight:650}
.muted{color:var(--ink-muted)}
.small{font-size:13px;line-height:18px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-3) var(--space-6)}
.kv dt{font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted)}
.kv dd{margin:2px 0 0}
.progress{height:8px;border-radius:var(--radius-pill);background:var(--surface-200);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:var(--radius-pill)}
.progress i.full{background:var(--olive-deep)}
.mono{font-family:var(--font-mono)}
.hrs{font-weight:700;font-size:13px;line-height:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
table.plain{border-collapse:collapse;width:100%;font-size:14px}
table.plain th{font-size:12px;font-weight:600;text-align:left;color:var(--ink-muted);border-bottom:1px solid var(--line-strong);padding:6px 8px}
table.plain td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.plain td.n,table.plain th.n{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- charts ---------- */
.chart{padding:16px 16px 12px}
.vbars{display:flex;align-items:flex-end;gap:10px;height:180px;border-bottom:1px solid var(--line-strong);padding:0 4px}
.vbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;outline:none}
.vbar .v{font-size:12px;line-height:16px;font-weight:600;color:var(--ink);margin-bottom:4px;font-variant-numeric:tabular-nums;min-height:16px}
.vbar .b{position:relative;width:100%;max-width:48px;background:var(--brand);border-radius:4px 4px 0 0}
.vbar.on .b{background:var(--brand-strong)}
.vbar:hover .b,.vbar:focus-visible .b{filter:brightness(1.08)}
.vbar:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tip{position:absolute;bottom:calc(100% + 26px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface-000);font-size:12px;line-height:16px;font-weight:500;padding:6px 8px;border-radius:var(--radius-sm);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 120ms;z-index:5}
.vbar:hover .tip,.vbar:focus .tip{opacity:1}
.vlabels{display:flex;gap:10px;padding:6px 4px 0}
.vlabels span{flex:1;text-align:center;font-size:12px;line-height:16px;color:var(--ink-muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vlabels span.on{color:var(--ink);font-weight:700}
.chart-foot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-muted);padding:8px 4px 0}
.hbars{display:flex;flex-direction:column;gap:10px;padding:16px}
.hbar{display:grid;grid-template-columns:minmax(110px,46%) 1fr 48px;gap:10px;align-items:center;font-size:13px;line-height:18px;border-radius:4px}
.hbar[onclick]{cursor:pointer}
.hbar[onclick]:hover .l{text-decoration:underline}
.hbar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{height:10px;background:var(--surface-200);border-radius:2px;overflow:hidden}
.hbar .f{display:block;height:100%;background:var(--brand);border-radius:0 4px 4px 0}
.hbar .n{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.f-not-started{background:var(--line-strong)!important}.f-in-progress{background:var(--amber)!important}.f-blocked{background:var(--danger)!important}.f-completed{background:var(--olive-deep)!important}.f-cancelled{background:var(--line)!important}
.f-full{background:var(--olive-deep)!important}

/* ---------- buttons, chips, inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:38px;padding:0 14px;border-radius:var(--radius-md);border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color 120ms,border-color 120ms}
.btn-primary{background:var(--brand);color:var(--on-brand)}.btn-primary:hover{background:var(--brand-strong)}
.btn-secondary{background:var(--surface-100);color:var(--ink);border-color:var(--line-strong)}.btn-secondary:hover{background:var(--surface-200)}
.btn-quiet{background:transparent;color:var(--brand-ink)}.btn-quiet:hover{background:var(--brand-tint)}
.btn-danger{background:var(--danger);color:var(--on-danger)}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--radius-md);border:0;background:none;cursor:pointer;color:var(--ink-muted);text-decoration:none}
.icon-btn:hover{background:var(--surface-200);color:var(--ink)}
.chips{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center;margin-bottom:var(--space-4)}
.chip{min-height:34px;padding:0 12px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);background:var(--surface-100);cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface-000)}
.input{width:100%;background:var(--surface-100);border:1px solid var(--line-strong);border-radius:var(--radius-md);min-height:42px;padding:9px var(--space-3);color:var(--ink)}
textarea.input{line-height:22px;resize:vertical}
.chips select.input{width:auto;min-height:34px;padding:4px 10px;font-size:13px}
.field{display:flex;flex-direction:column;gap:var(--space-1);min-width:0}
.field label{font-size:13px;line-height:18px;font-weight:600}
.field .req{font-weight:400;color:var(--ink-muted)}
.hint{font-size:13px;line-height:18px;color:var(--ink-muted)}
.err{font-size:13px;line-height:18px;color:var(--danger);font-weight:600}
.err:empty{display:none}
.field.bad .input{border-color:var(--danger)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.form-grid .wide{grid-column:1/-1}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:var(--space-1);padding:1px 8px;border-radius:var(--radius-sm);font-size:12px;line-height:18px;font-weight:600;white-space:nowrap}
.badge svg{width:12px;height:12px}
.s-not-started{background:var(--surface-200);color:var(--ink-muted)}
.s-in-progress{background:var(--warning-tint);color:var(--warning-ink)}
.s-blocked{background:var(--danger-tint);color:var(--danger)}
.s-completed{background:var(--success-tint);color:var(--success-ink)}
.s-cancelled{color:var(--ink-muted);text-decoration:line-through;box-shadow:inset 0 0 0 1px var(--line-strong)}
.b-brand{background:var(--brand-tint);color:var(--brand-ink)}
.b-plain{background:var(--surface-200);color:var(--ink-muted)}
.pri{display:inline-flex;align-items:center;gap:var(--space-1);font-size:12px;line-height:16px;font-weight:600;color:var(--ink-muted)}
.pri-bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.pri-bars i{width:3px;background:var(--line);border-radius:1px}
.pri-bars i.on{background:currentColor}
.pri-high{color:var(--warning-ink)}.pri-urgent{color:var(--danger)}

/* ---------- rows ---------- */
.list > * + *{border-top:1px solid var(--line)}
.task{display:flex;gap:var(--space-3);align-items:flex-start;padding:11px var(--space-4)}
.check{flex:none;position:relative;width:20px;height:20px;margin-top:1px;border-radius:5px;border:1.5px solid var(--line-strong);background:var(--surface-100);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.check::after{content:"";position:absolute;inset:-12px}
.check:hover{border-color:var(--olive-deep)}
.check.on{background:var(--olive-deep);border-color:var(--olive-deep);color:var(--surface-100)}
.check svg{width:14px;height:14px}
.rowbtn{flex:1;min-width:0;display:block;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.row{display:flex;gap:var(--space-3);align-items:center;justify-content:space-between;padding:11px var(--space-4);min-height:44px}
.row:hover,.task:hover{background:var(--surface-200)}
.row-title{font-weight:600;display:block;overflow-wrap:anywhere}
.task.done .row-title{color:var(--ink-muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;line-height:18px;color:var(--ink-muted);margin-top:3px}
.due-overdue{color:var(--danger);font-weight:600}
.due-today{color:var(--warning-ink);font-weight:600}
.when{flex:none;width:64px;text-align:left;font-size:12px;line-height:16px;color:var(--ink-muted)}
.when b{display:block;font-size:13px;color:var(--ink)}
.daygroup{padding:8px 16px;font-size:12px;font-weight:700;color:var(--ink-muted);background:var(--surface-200);letter-spacing:.02em}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:var(--space-4)}
.pcard{display:block;text-align:left;width:100%;background:var(--surface-100);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4);cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--shadow-card)}
.pcard:hover{border-color:var(--line-strong)}
.pcard h3{margin:0 0 4px;font-size:16px;line-height:22px}

/* ---------- menus, quick add ---------- */
.fab-wrap{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:30;display:none;flex-direction:column;align-items:flex-end;gap:var(--space-2)}
.fab{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border:0;border-radius:16px;background:var(--brand);color:var(--on-brand);box-shadow:var(--shadow-float);cursor:pointer}
.fab .ic{width:24px;height:24px}
.menu{background:var(--surface-100);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-float);padding:6px;min-width:220px;color:var(--ink)}
.menu button{display:flex;width:100%;align-items:center;gap:var(--space-3);min-height:40px;padding:0 10px;background:none;border:0;border-radius:var(--radius-md);cursor:pointer;text-align:left;font-size:14px}
.menu button:hover,.menu button:focus-visible{background:var(--surface-200)}
.menu button kbd{margin-left:auto}
.menu .ic{color:var(--ink-muted)}
.newmenu{position:absolute;left:0;top:calc(100% + 6px);z-index:40;width:100%}
.capture{display:flex;gap:var(--space-2);flex-wrap:wrap;background:var(--surface-100);border:1px solid var(--line);border-radius:var(--radius-lg);padding:10px;margin-bottom:20px;box-shadow:var(--shadow-card)}
.capture input{flex:1;min-width:200px;border-color:transparent;background:var(--surface-200)}

/* ---------- AI / draft ---------- */
.draft{background:var(--surface-200);border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);padding:var(--space-4);margin-top:var(--space-4)}
.draft-head{display:flex;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap;font-size:12px;line-height:16px;font-weight:700;color:var(--ink-muted);margin-bottom:var(--space-2)}
.draft-item{display:grid;grid-template-columns:auto 1fr 160px;gap:var(--space-2);align-items:center;margin-bottom:var(--space-2)}
@media (max-width:600px){.draft-item{grid-template-columns:auto 1fr}.draft-item input[type=date]{grid-column:2}}
.blocked-box{background:var(--danger-tint);color:var(--danger);border-radius:var(--radius-md);padding:var(--space-3);font-size:13px;line-height:18px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(20,14,10,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh var(--space-4) var(--space-4);overflow:auto}
.sheet{width:100%;max-width:680px;background:var(--surface-100);border-radius:var(--radius-lg);box-shadow:var(--shadow-float);animation:up 180ms ease-out}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (max-width:600px){.scrim{padding:0;align-items:flex-end}.sheet{border-radius:var(--radius-lg) var(--radius-lg) 0 0;max-height:92vh;overflow:auto}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);padding:var(--space-4) var(--space-4) var(--space-3);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface-100);z-index:1;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.sheet-head h2{margin:0;font-size:19px;line-height:26px}
.sheet-body{padding:var(--space-4)}
.sheet-foot{display:flex;justify-content:flex-end;gap:var(--space-2);flex-wrap:wrap;padding:var(--space-3) var(--space-4);border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface-100)}
.history{list-style:none;margin:0;padding:0}
.history li{padding:var(--space-2) 0;border-top:1px solid var(--line);font-size:13px;line-height:18px}
.history li:first-child{border-top:0}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;display:flex;flex-direction:column;gap:var(--space-2);align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--surface-000);padding:9px 10px 9px 14px;border-radius:var(--radius-md);font-weight:600;font-size:14px;box-shadow:var(--shadow-float);max-width:90vw;pointer-events:auto}
.toast button{background:none;border:0;color:var(--amber);font-weight:700;cursor:pointer;padding:2px 6px;border-radius:4px}
.toast.warn{background:var(--amber);color:var(--on-amber)}
.toast.warn button{color:var(--on-amber);text-decoration:underline}
.toast.danger{background:var(--danger);color:var(--on-danger)}
@media (max-width:900px){.toasts{bottom:calc(150px + env(safe-area-inset-bottom))}}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-4)}
.login-card{width:100%;max-width:400px;background:var(--surface-100);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-6);box-shadow:var(--shadow-card)}
.login-card .mark{display:block;padding:0 0 var(--space-6)}
.login-card .mark svg{height:38px;width:auto}

/* ---------- reports, BDIH document house style ---------- */
.report{font-family:var(--font-serif);font-size:16px;line-height:24px;color:#000;background:#fff;padding:var(--space-6)}
.report h1{font-size:22px;line-height:28px;margin:0 0 4px}
.report h2{font-size:17px;margin:20px 0 8px}
.report table{border-collapse:collapse;width:100%;font-size:14px;line-height:20px}
.report th{background:#b0613f;color:#fff;font-weight:700;text-align:left}
.report th,.report td{border:1px solid #000;padding:6px 8px;vertical-align:top}
@media print{
  body.printing > *:not(#sheet-root){display:none!important}
  body.printing .scrim{position:static;background:none;padding:0;display:block}
  body.printing .sheet{box-shadow:none;max-width:none;border-radius:0}
  body.printing .sheet-head,body.printing .sheet-foot{display:none}
}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.keypad button{min-height:48px;border:1px solid var(--line);background:var(--surface-200);border-radius:var(--radius-md);font-size:18px;font-weight:600;cursor:pointer;color:var(--ink)}
.keypad button:hover{border-color:var(--line-strong)}
.keypad button:active{background:var(--brand-tint)}
.keypad button:nth-child(10),.keypad button:nth-child(12){font-size:13px;color:var(--ink-muted)}
.pin-input{font-size:22px;letter-spacing:.4em;text-align:center}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{display:flex;flex-direction:column;gap:4px;padding:0;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-200);overflow:hidden;cursor:pointer;text-align:left}
.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface-200)}
.thumb span{font-size:11px;line-height:14px;color:var(--ink-muted);padding:0 8px 6px}
.thumb:hover{border-color:var(--line-strong)}
.thumb-missing{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;font-size:12px;color:var(--ink-muted)}
img.preview{display:block;max-width:100%;max-height:60vh;margin:0 auto 16px;border-radius:var(--radius-md);border:1px solid var(--line)}
.dropzone{display:flex;gap:14px;align-items:center;padding:20px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);background:var(--surface-100);cursor:pointer}
.dropzone .ic{width:28px;height:28px;color:var(--brand)}
.dropzone:hover,.dropzone.over{background:var(--brand-tint);border-color:var(--brand)}
.dropzone:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.me{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--rail-line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.me-txt{flex:1;min-width:0;font-size:12px;line-height:16px;color:var(--rail-muted)}
.me-txt b{display:block;font-size:13px;color:var(--rail-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-icon{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:6px;color:var(--rail-muted);cursor:pointer}
.rail-icon:hover{background:var(--rail-hover);color:var(--rail-ink)}
</style>
</head>

const LONGM = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr = () => ymd(new Date());
const addDays = (s,n) => { const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const parse = s => new Date(s.length===10 ? s+"T00:00:00" : s);
const localDay = iso => iso ? ymd(new Date(iso)) : "";
function fmtDate(s){ if(!s) return ""; const d = parse(s); return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; }
function fmtLong(s){ const d = parse(s); return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]+" "+d.getDate()+" "+LONGM[d.getMonth()]+" "+d.getFullYear(); }
function fmtDT(iso){ if(!iso) return ""; const d = new Date(iso); return fmtDate(ymd(d))+", "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function toLocalInput(iso){ if(!iso) return ""; const d = new Date(iso); return ymd(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); }
const daysAgo = iso => iso ? Math.floor((Date.now()-new Date(iso).getTime())/86400000) : 0;
const fmtH = h => (Math.round((Number(h)||0)*100)/100)+" h";

function weekStart(d){ const x = parse(d); const k = (x.getDay()+6)%7; x.setDate(x.getDate()-k); return ymd(x); }
const timeToMin = t => { const [h,m] = String(t).split(":").map(Number); return h*60+m; };

/* ---------- task helpers ---------- */
function dueState(t){ if(!isOpen(t) || !t.due_date) return "none"; const td = todayStr(); return t.due_date < td ? "overdue" : t.due_date === td ? "today" : "upcoming"; }
function dueText(t){
  if(t.status === "completed") return t.completed_at ? "Done "+fmtDate(localDay(t.completed_at)) : "Done";
  if(!t.due_date) return "";
  const st = dueState(t);
  return st === "overdue" ? "Overdue, "+fmtDate(t.due_date) : st === "today" ? "Due today" : "Due "+fmtDate(t.due_date);
}
const DUE_RANK = {overdue:0,today:1,upcoming:2,none:3}, PRI_RANK = {urgent:0,high:1,medium:2,low:3};
function taskSort(a,b){ return (DUE_RANK[dueState(a)]-DUE_RANK[dueState(b)]) || (a.due_date||"9999").localeCompare(b.due_date||"9999") || ((PRI_RANK[a.priority]??2)-(PRI_RANK[b.priority]??2)); }
function progress(pid){ const ts = T("tasks").filter(t => t.project_id === pid && t.status !== "cancelled"); const done = ts.filter(t => t.status === "completed").length; return {done, total:ts.length, pct: ts.length ? Math.round(done*100/ts.length) : 0}; }

/* ---------- data layer: local memory or Supabase ---------- */
const strip = r => { const o = {}; for(const k in r) if(k[0] !== "_") o[k] = r[k]; return o; };
async function loadAll(){
  if(S.mode !== "supabase") return;
  for(const t of TABLES){
    const {data, error} = await S.client.from(t).select("*").order("created_at",{ascending:false});
    if(error){ S.bootError = "Could not read the "+t+" table: "+error.message+". Have you run kayk-workbench-setup.sql?"; throw error; }
    S.data[t] = data || [];
  }
  S.bootError = "";
}
async function saveRec(table, rec, opts={}){
  const arr = T(table);
  const r = {...rec};
  if(!r.id) r.id = uid();
  const prev = arr.find(x => x.id === r.id);
  const isNew = !prev;
  if(isNew && !r.created_at) r.created_at = nowISO();
  r.updated_at = nowISO();
  if(S.mode === "supabase"){
    const {data, error} = await S.client.from(table).upsert(strip(r)).select().single();
    if(error){ toast(error.message, "danger", 6000); throw error; }
    Object.assign(r, data);
  }
  const i = arr.findIndex(x => x.id === r.id);
  if(i >= 0) arr[i] = r; else arr.unshift(r);
  if(table !== "activity" && !opts.noLog){
    let summary = opts.summary;
    if(!summary){
      if(isNew) summary = "Created";
      else if(prev.status !== r.status && r.status) summary = "Status changed from "+((STATUS[prev.status]||PSTATUS[prev.status]||MSTATUS[prev.status]||MLSTATUS[prev.status]||prev.status||"none"))+" to "+(STATUS[r.status]||PSTATUS[r.status]||MSTATUS[r.status]||MLSTATUS[r.status]||r.status);
      else if(table === "tasks" && prev.due_date !== r.due_date) summary = r.due_date ? "Rescheduled to "+fmtDate(r.due_date) : "Due date removed";
      else summary = "Edited";
    }
    await logAct(table, r, isNew ? "created" : "updated", summary);
  }
  return r;
}
async function logAct(table, r, action, summary){
  try{ await saveRec("activity", {entity:table, entity_id:r.id, action, summary, title:recTitle(r), project_id: table === "projects" ? r.id : (r.project_id || null)}); }catch(e){}
}
async function delRec(table, id){
  const r = byId(table, id);
  if(S.mode === "supabase"){
    if(table === "documents" && r?.storage_path) await S.client.storage.from(CONFIG.STORAGE_BUCKET).remove([r.storage_path]);
    const {error} = await S.client.from(table).delete().eq("id", id);
    if(error){ toast(error.message, "danger", 6000); throw error; }
  }
  S.data[table] = T(table).filter(x => x.id !== id);
  if(table === "projects"){ ["tasks","meetings","notes","documents","timesheet"].forEach(t => T(t).forEach(x => { if(x.project_id === id) x.project_id = null; })); S.data.milestones = T("milestones").filter(x => x.project_id !== id); }
  if(table === "meetings") ["tasks","documents"].forEach(t => T(t).forEach(x => { if(x.meeting_id === id) x.meeting_id = null; }));
  if(r) await logAct(table, r, "deleted", "Deleted");
}
async function connectSupabase(url, key){
  await loadScript(SUPABASE_JS);
  if(!window.supabase?.createClient) throw new Error("The Supabase library did not load.");
  const hasLocal = TABLES.some(t => t !== "activity" && T(t).length);
  if(hasLocal) S.localCopy = JSON.parse(JSON.stringify(S.data));
  S.client = window.supabase.createClient(url, key);
  S.mode = "supabase";
  TABLES.forEach(t => S.data[t] = []);
  const {data} = await S.client.auth.getSession();
  S.user = data.session?.user || null;
  if(S.user){ try{ await loadAll(); S.me = await loadProfile(); S.lastActive = Date.now(); }catch(e){ S.bootError = e.message; S.me = null; } }
  S.client.auth.onAuthStateChange((ev, session) => {
    const was = S.user?.id; S.user = session?.user || null;
    if(!S.user && was){ S.me = null; S.data = emptyData(); render(); }
  });
}

/* ---------- reminders ---------- */
function checkReminders(){
  const now = Date.now();
  T("reminders").forEach(r => {
    if(r.done || !r.remind_at) return;
    const key = r.id+r.remind_at;
    if(S.notified.has(key) || new Date(r.remind_at).getTime() > now) return;
    S.notified.add(key);
    toast("Reminder: "+r.title, "warn", 9000);
    if("Notification" in window && Notification.permission === "granted"){ try{ new Notification(APP_NAME, {body:r.title}); }catch(e){} }
  });
  const c = document.querySelector("[data-remcount]");
  if(c){ const n = dueReminders().length; c.textContent = n; c.hidden = !n; }
}
const dueReminders = () => T("reminders").filter(r => !r.done && r.remind_at && new Date(r.remind_at).getTime() <= Date.now());
function nextOccurrence(iso, rec){
  const d = new Date(iso);
  do{
    if(rec === "daily") d.setDate(d.getDate()+1);
    else if(rec === "weekly") d.setDate(d.getDate()+7);
    else d.setMonth(d.getMonth()+1);
  } while(d.getTime() <= Date.now());
  return d.toISOString();
}

function fieldHTML(f, rec){
  const id = "f_"+f.k;
  let v = rec[f.k];
  if(v == null || v === "") v = (typeof f.def === "function" ? f.def() : f.def) ?? "";
  if(f.t === "datetime-local") v = toLocalInput(v);
  let input;
  if(f.t === "textarea") input = '<textarea class="input" id="'+id+'" name="'+f.k+'" rows="'+(f.rows||3)+'" maxlength="20000">'+esc(v)+'</textarea>';
  else if(f.t === "select"){ const opts = typeof f.o === "function" ? f.o() : Object.entries(f.o); input = '<select class="input" id="'+id+'" name="'+f.k+'">'+opts.map(([k,l]) => '<option value="'+esc(k)+'"'+(String(k) === String(v) ? " selected" : "")+'>'+esc(l)+'</option>').join("")+'</select>'; }
  else if(f.t === "file") input = '<input class="input" type="file" id="'+id+'" name="'+f.k+'" accept="'+ALLOWED_EXT.map(e => "."+e).join(",")+'">';
  else input = '<input class="input" type="'+(f.t||"text")+'" id="'+id+'" name="'+f.k+'" value="'+esc(v)+'"'+(!f.t || f.t === "text" ? ' maxlength="300"' : "")+(f.step ? ' step="'+f.step+'" min="0" max="24" inputmode="decimal"' : "")+(f.ph ? ' placeholder="'+esc(f.ph)+'"' : "")+(f.dl ? ' list="dl_'+f.k+'"' : "")+'>'+(f.dl ? '<datalist id="dl_'+f.k+'">'+f.dl().map(x => '<option value="'+esc(x)+'">').join("")+'</datalist>' : "");
  return '<div class="field'+(f.wide ? " wide" : "")+'" data-f="'+f.k+'"><label for="'+id+'">'+esc(f.l)+(f.req ? ' <span class="req">(required)</span>' : "")+'</label>'+input+(f.hint ? '<div class="hint">'+esc(f.hint)+'</div>' : "")+'<div class="err"></div></div>';
}
function openForm(table, rec={}, defaults={}){
  const cfg = FORMS[table];
  const isNew = !rec.id;
  S.form = {table, rec:{...defaults, ...rec}, isNew};
  const fields = cfg.fields.filter(f => !(f.newOnly && !isNew));
  const head = (isNew ? "New " : "Edit ")+cfg.name + (table === "documents" && !isNew ? " details or replace file" : "");
  sheet('<form onsubmit="App.submitForm(event)" novalidate><div class="sheet-head"><h2>'+esc(head.charAt(0).toUpperCase()+head.slice(1))+'</h2><button type="button" class="icon-btn" onclick="App.closeSheet()" aria-label="Close">'+ic("close")+'</button></div><div class="sheet-body"><div class="form-grid">'+fields.map(f => fieldHTML(f, S.form.rec)).join("")+'</div></div><div class="sheet-foot"><button type="button" class="btn btn-quiet" onclick="App.closeSheet()">Cancel</button><button class="btn btn-primary" type="submit">'+(isNew ? "Save "+cfg.name : "Save changes")+'</button></div></form>');
  setTimeout(() => $("#sheet-root input:not([type=file]),#sheet-root textarea")?.focus(), 60);
}
function fieldError(k, msg){ const el = $('#sheet-root [data-f="'+k+'"]'); if(!el) return; el.classList.add("bad"); el.querySelector(".err").textContent = msg; }
async function submitForm(e){
  e.preventDefault();
  const form = e.target, {table, isNew} = S.form, cfg = FORMS[table];
  form.querySelectorAll(".field").forEach(f => { f.classList.remove("bad"); f.querySelector(".err").textContent = ""; });
  const fd = new FormData(form);
  const rec = {...S.form.rec};
  let ok = true, file = null, reminderAt = null;
  for(const f of cfg.fields){
    if(f.newOnly && !isNew) continue;
    if(f.t === "file"){ const x = fd.get(f.k); if(x && x.size) file = x; continue; }
    let v = fd.get(f.k); v = typeof v === "string" ? v.trim() : v;
    if(f.req && !v){ fieldError(f.k, "Enter "+f.l.toLowerCase()+"."); ok = false; }
    if(f.t === "datetime-local" && v) v = new Date(v).toISOString();
    if(f.k === "_reminder"){ reminderAt = v || null; continue; }
    rec[f.k] = v === "" ? null : v;
  }
  if(table === "tasks" && rec.status === "blocked" && !rec.blocked_reason){ fieldError("blocked_reason", "Say why it is blocked, so you know what to chase."); ok = false; }
  if(table === "timesheet"){
    if(rec.start_time && rec.end_time){ const d = timeToMin(rec.end_time) - timeToMin(rec.start_time); if(d <= 0){ fieldError("end_time", "End must be after start."); ok = false; } else rec.hours = Math.round(d/60*100)/100; }
    else if(rec.start_time && !rec.end_time && !rec.hours){ fieldError("end_time", "Add an end time, or enter hours."); ok = false; }
    if(ok){ const h = Number(rec.hours); if(!rec.hours){ fieldError("hours", "Enter hours, or a start and end time."); ok = false; } else if(!(h > 0 && h <= 24)){ fieldError("hours", "Hours must be between 0 and 24."); ok = false; } else rec.hours = h; }
  }
  if(table === "milestones") rec.completed_at = rec.status === "done" ? (rec.completed_at || nowISO()) : null;
  if(table === "documents"){
    if(isNew && !file){ fieldError("_file", "Choose a file to upload."); ok = false; }
    if(file){
      const ext = (file.name.split(".").pop() || "").toLowerCase();
      if(!ALLOWED_EXT.includes(ext)){ fieldError("_file", "That file type is not allowed. Use "+ALLOWED_EXT.join(", ")+"."); ok = false; }
      if(file.size > CONFIG.MAX_UPLOAD_MB*1048576){ fieldError("_file", "The file is "+fmtSize(file.size)+". The limit is "+CONFIG.MAX_UPLOAD_MB+" MB."); ok = false; }
    }
  }
  if(!ok) return;
  const btn = form.querySelector("[type=submit]"); btn.disabled = true;
  try{
    if(table === "tasks"){
      if(rec.status === "completed" && !rec.completed_at) rec.completed_at = nowISO();
      if(rec.status !== "completed") rec.completed_at = null;
      if(rec.status !== "blocked") rec.blocked_reason = rec.blocked_reason || null;
    }
    let summary;
    if(table === "documents" && file){
      if(!rec.id) rec.id = uid();
      if(!rec.title) rec.title = file.name.replace(/\.[^.]+$/, "");
      const sp = await sniffProblem(file); if(sp){ fieldError("_file", sp); btn.disabled = false; return; }
      if(/^image\//.test(file.type)) file = await shrinkImage(file);
      await storeFile(rec, file);
      if(!isNew) summary = "File replaced with "+file.name+(rec.version ? ", version "+rec.version : "");
    }
    const saved = await saveRec(table, rec, {summary});
    if(reminderAt) await saveRec("reminders", {title:saved.title, remind_at:reminderAt, recurrence:"none", related_type:"tasks", related_id:saved.id, done:false});
    closeSheet();
    toast(FORMS[table].name.charAt(0).toUpperCase()+FORMS[table].name.slice(1)+" saved");
    if(isNew && table === "projects") location.hash = "#/project/"+saved.id;
    else if(isNew && table === "meetings" && !S.form?.stay) location.hash = "#/meeting/"+saved.id;
    render();
  }catch(err){
    btn.disabled = false;
    toast(err.message || "Could not save", "danger", 6000);
  }
}

function rank(q){
  const ql = q.toLowerCase().trim(); if(!ql) return [];
  let terms = ql.split(/[^a-z0-9]+/).filter(w => w.length > 1 && !STOP.has(w)); if(!terms.length) terms = [ql];
  const out = [];
  for(const t of ["meetings","notes","tasks","projects","documents","milestones","timesheet"]) for(const r of T(t)){
    const tx = recText(t, r).toLowerCase(); let score = tx.includes(ql) ? 5 : 0;
    for(const w of terms){ const n = tx.split(w).length-1; score += n; if(recTitle(r).toLowerCase().includes(w)) score += 3; }
    if(score) out.push({t, r, score, tx});
  }
  return out.sort((a,b) => b.score-a.score);
}
function snippet(tx, q){ const w = q.toLowerCase().split(/[^a-z0-9]+/).find(x => x.length > 2 && tx.includes(x)) || ""; const i = Math.max(0, tx.indexOf(w)-60); return (i ? "..." : "")+tx.slice(i, i+180).replace(/\s+/g," ")+(tx.length > i+180 ? "..." : ""); }
function openJS(t, r){ if(t === "milestones" || t === "timesheet") return "App.edit('"+t+"','"+r.id+"')"; return t === "tasks" ? "App.openTask('"+r.id+"')" : t === "notes" ? "App.openNote('"+r.id+"')" : t === "documents" ? "App.openDoc('"+r.id+"')" : t === "projects" ? "location.hash='#/project/"+r.id+"'" : "location.hash='#/meeting/"+r.id+"'"; }
function resultRow(x, q){ return row(recTitle(x.r), '<span class="badge b-brand">'+ENTITY_WORD[x.t]+'</span><span>'+esc(snippet(x.tx, q))+'</span>', openJS(x.t, x.r)); }

   Supabase mode: PINs are hashed and checked inside the database by pin_login() in
   kayk-workbench-setup.sql, with a lockout after 5 wrong tries. Nothing secret is in this file.
   Local preview mode: accounts live in memory for this tab only. The PIN screen is a curtain,
   not a lock, because anyone can read browser code. Use Supabase for real protection. */
const LOCAL_ADMIN = {username:"kayk", full_name:"KayK Letsweletse", job_title:"ICT Business Analyst", pin_hash:"cfb69c1f57f7050915d875ed817b2a97ec434c760882a8cc41cf1efde1ed02b9"};
const MAX_TRIES = 5, LOCK_MIN = 15, IDLE_LOCK_MIN = 15;
const WEAK_PINS = new Set(["0000","1111","2222","3333","4444","5555","6666","7777","8888","9999","1234","4321","1212","0123","9876","2580","123456","654321","000000","111111","121212","112233"]);
const myName = () => S.me?.full_name || "KayK";

async function sha256(s){
  if(window.crypto?.subtle){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join(""); }
  let h = 5381; for(const c of s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return "weak"+h;
}
const pinHash = (username, pin) => sha256("kwb:"+username.toLowerCase()+":"+pin);
function pinProblem(pin, confirm){
  if(!/^\d{4,8}$/.test(pin)) return "Use 4 to 8 digits.";
  if(WEAK_PINS.has(pin) || /^(\d)\1+$/.test(pin)) return "That PIN is too easy to guess. Avoid repeats and simple sequences.";
  if(confirm !== undefined && pin !== confirm) return "The two PINs do not match.";
  return "";
}
const usernameProblem = u => /^[a-z0-9][a-z0-9.\-]{2,29}$/.test(u) ? "" : "Use 3 to 30 lowercase letters, digits, dots or dashes.";

function localEvent(event, username, user_id){ S.events.unshift({at:nowISO(), username, user_id, event}); S.events.length = Math.min(S.events.length, 200); }
async function localLogin(username, pin){
  const generic = "Wrong name or PIN. After "+MAX_TRIES+" wrong tries the account locks for "+LOCK_MIN+" minutes.";
  const u = S.users.find(x => x.username === username);
  if(!u){ localEvent("login_unknown_user", username); throw new Error(generic); }
  if(u.locked_until && new Date(u.locked_until) > new Date()){ localEvent("login_while_locked", username, u.id); throw new Error("Too many wrong tries. Try again after "+fmtDT(u.locked_until).split(", ")[1]+"."); }
  if(await pinHash(u.username, pin) !== u.pin_hash){
    u.failed = (u.failed||0) + 1;
    localEvent(u.failed >= MAX_TRIES ? "account_locked" : "login_failed", username, u.id);
    if(u.failed >= MAX_TRIES){ u.failed = 0; u.locked_until = new Date(Date.now()+LOCK_MIN*60000).toISOString(); throw new Error("Too many wrong tries. This account is locked for "+LOCK_MIN+" minutes."); }
    throw new Error(generic);
  }
  u.failed = 0; u.locked_until = null;
  if(u.disabled){ localEvent("login_disabled", username, u.id); throw new Error("This account is switched off. Ask your administrator."); }
  u.last_login = nowISO(); localEvent("login_ok", username, u.id);
  return u;
}
async function loadProfile(){
  const {data, error} = await S.client.rpc("my_profile");
  if(error) throw new Error("Could not load your profile: "+error.message+". Have you run kayk-workbench-setup.sql?");
  const p = Array.isArray(data) ? data[0] : data;
  if(!p) throw new Error("No profile is linked to this account.");
  return p;
}
async function supaLogin(username, pin){
  const {data:rows, error:e1} = await S.client.rpc("pin_login", {p_username:username, p_pin:pin});
  if(e1) throw new Error("Sign in is unavailable right now. Check that the setup SQL has been run.");
  const r = (Array.isArray(rows) ? rows[0] : rows) || {status:"bad"};
  if(r.status === "locked") throw new Error("Too many wrong tries. Try again after "+r.until_local+".");
  if(r.status === "disabled") throw new Error("This account is switched off. Ask your administrator.");
  if(r.status !== "ok") throw new Error("Wrong name or PIN. After "+MAX_TRIES+" wrong tries the account locks for "+LOCK_MIN+" minutes.");
  const {error} = await S.client.auth.signInWithPassword({email:r.email, password:r.secret});
  if(error) throw new Error("Sign in failed: "+error.message);
  const {data} = await S.client.auth.getSession(); S.user = data.session?.user || null;
  await loadAll();
  return await loadProfile();
}

const IMG_EXT = ["png","jpg","jpeg","gif","webp"];
const isImage = d => /^image\//.test(d.mime||"") || IMG_EXT.includes((d.file_name||"").split(".").pop().toLowerCase());
async function shrinkImage(file, maxDim=2200, quality=0.82){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type) || !window.createImageBitmap) return file;
  try{
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxDim/Math.max(bmp.width, bmp.height));
    if(scale === 1 && file.size < 1.5*1048576 && file.type !== "image/jpeg") return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*scale); c.height = Math.round(bmp.height*scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", quality));
    if(!blob || (blob.size >= file.size && file.type !== "image/jpeg")) return file;   // JPEGs are always re-encoded so EXIF location data is dropped
    return new File([blob], file.name.replace(/\.[^.]+$/, "")+".jpg", {type:"image/jpeg"});
  }catch(e){ return file; }
}
const SAFE_TYPES = {pdf:"application/pdf",doc:"application/msword",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",xls:"application/vnd.ms-excel",xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",csv:"text/csv",ppt:"application/vnd.ms-powerpoint",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",txt:"text/plain",md:"text/markdown"};
async function sniffProblem(file){
  const b = new Uint8Array(await file.slice(0, 512).arrayBuffer());
  const head = String.fromCharCode(...b.slice(0, 64)).toLowerCase().replace(/^\ufeff|\s+/g, "");
  if(b[0] === 0x4d && b[1] === 0x5a) return file.name+" looks like a Windows program, not a document.";
  if(b[0] === 0x7f && b[1] === 0x45 && b[2] === 0x4c && b[3] === 0x46) return file.name+" looks like a program, not a document.";
  if(head.startsWith("#!") || head.startsWith("<!doctype") || head.startsWith("<html") || head.startsWith("<script") || head.startsWith("<svg") || head.startsWith("<?xml")) return file.name+" contains web or script code and was blocked.";
  const ext = file.name.split(".").pop().toLowerCase();
  const sig = {pdf:[0x25,0x50,0x44,0x46], png:[0x89,0x50,0x4e,0x47], jpg:[0xff,0xd8,0xff], jpeg:[0xff,0xd8,0xff], gif:[0x47,0x49,0x46], docx:[0x50,0x4b], xlsx:[0x50,0x4b], pptx:[0x50,0x4b], doc:[0xd0,0xcf], xls:[0xd0,0xcf], ppt:[0xd0,0xcf]}[ext];
  if(sig && !sig.every((v,i) => b[i] === v)) return file.name+" is not really a ."+ext+" file, so it was blocked.";
  if(ext === "webp" && !(head.startsWith("riff") && String.fromCharCode(...b.slice(8,12)) === "WEBP")) return file.name+" is not really a .webp file, so it was blocked.";
  return "";
}
function fileProblem(file){
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  if(!ALLOWED_EXT.includes(ext)) return file.name+": that file type is not allowed.";
  if(file.size > CONFIG.MAX_UPLOAD_MB*1048576) return file.name+" is "+fmtSize(file.size)+". The limit is "+CONFIG.MAX_UPLOAD_MB+" MB.";
  return "";
}
async function storeFile(rec, file){
  if(!rec.id) rec.id = uid();
  if(S.mode === "supabase"){
    const path = S.user.id+"/"+rec.id+"/"+Date.now()+"_"+file.name.replace(/[^\w.\- ]+/g,"_");
    const ctype = SAFE_TYPES[file.name.split(".").pop().toLowerCase()] || "application/octet-stream";
    const {error} = await S.client.storage.from(CONFIG.STORAGE_BUCKET).upload(path, file, {upsert:false, contentType:ctype});
    if(error) throw error;
    rec.storage_path = path; delete S.thumbs[rec.id];
  } else {
    if(S.blobs[rec.id]) URL.revokeObjectURL(S.blobs[rec.id]);
    S.blobs[rec.id] = URL.createObjectURL(file);
  }
  rec.file_name = file.name.slice(0, 200); rec.mime = SAFE_TYPES[file.name.split(".").pop().toLowerCase()] || ""; rec.size = file.size;
  return rec;
}
async function quickUpload(files, meta, opts={}){
  const list = [...files]; let ok = 0; const errs = [];
  for(let [i, f] of list.entries()){
    if(opts.photo || /^image\//.test(f.type)) f = await shrinkImage(f);
    const p = fileProblem(f) || await sniffProblem(f); if(p){ errs.push(p); continue; }
    try{
      const rec = await storeFile({title:opts.title ? opts.title+(list.length > 1 ? " ("+(i+1)+")" : "") : f.name.replace(/\.[^.]+$/, ""), version:"1.0", category:opts.photo ? "photo" : (meta.category || "other"), ...meta}, f);
      await saveRec("documents", rec, {summary:opts.photo ? "Photo of notes added" : "Uploaded"}); ok++;
    }catch(e){ errs.push(f.name+": "+e.message); }
  }
  if(ok) toast(ok+(opts.photo ? " photo"+(ok === 1 ? "" : "s")+" added" : " file"+(ok === 1 ? "" : "s")+" uploaded"));
  if(errs.length) toast(errs[0]+(errs.length > 1 ? " (and "+(errs.length-1)+" more)" : ""), "danger", 7000);
  render();
}
async function fileURL(d){
  if(S.mode === "local") return S.blobs[d.id] || "";
  if(!d.storage_path) return "";
  const c = S.thumbs[d.id]; if(c && c.exp > Date.now()) return c.url;
  const {data, error} = await S.client.storage.from(CONFIG.STORAGE_BUCKET).createSignedUrl(d.storage_path, 900);
  if(error) return "";
  S.thumbs[d.id] = {url:data.signedUrl, exp:Date.now()+840000}; return data.signedUrl;
}

/* ---------- rule based action extraction ---------- */
function findDate(s){
  const m = s.match(/\b(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i);
  if(m){ const d = new Date(new Date().getFullYear(), MONTHS.findIndex(x => x.toLowerCase() === m[2].toLowerCase().slice(0,3)), +m[1]); return ymd(d); }
  const w = s.match(/\bby\s+(mon|tue|wed|thu|fri|sat|sun)[a-z]*\b/i);
  if(w){ const target = DAYS.findIndex(x => x.toLowerCase() === w[1].toLowerCase()); const d = new Date(); let add = (target - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate()+add); return ymd(d); }
  if(/\btomorrow\b/i.test(s)) return addDays(todayStr(), 1);
  return "";
}
function extractActions(text){
  const lead = /^(action( item)?|todo|to do|ai|follow up|next step)s?\b\s*[:\-]?\s*/i;
  const verb = /\b(will|to send|to share|to confirm|to prepare|to update|to review|to draft|to schedule|to book|to circulate|to follow up|needs? to|must|should|is to|are to)\b/i;
  const seen = new Set();
  return text.split(/\n+/).map(l => l.trim().replace(/^[\-\*\u2022\d.)\s]+/, "")).filter(l => l.length > 6 && (lead.test(l) || verb.test(l)))
    .map(l => ({title:l.replace(lead, "").slice(0,180), due:findDate(l)})).filter(x => !seen.has(x.title) && seen.add(x.title));
}

function periodModel(from, to){

function weekModel(ws){

      tsec("Tasks completed", ["Action","Project","Completed"], done.map(t => [t.title, pn(t.project_id), fmtDate(localDay(t.completed_at))])),

      tsec("Project status", ["Project","Priority","Status","Progress","Overdue","Next milestone"], T("projects").filter(p => p.status !== "cancelled").sort((a,b) => PRI_RANK[a.priority||"medium"]-PRI_RANK[b.priority||"medium"]).map(p => { const pr = progress(p.id); const nm = T("milestones").filter(m => m.project_id === p.id && m.status !== "done").sort(msSort)[0]; return [p.name, PRIORITY[p.priority||"medium"], PSTATUS[p.status], pr.done+" of "+pr.total+" ("+pr.pct+"%)", T("tasks").filter(t => t.project_id === p.id && dueState(t) === "overdue").length, nm ? nm.title+(nm.due_date ? ", "+fmtDate(nm.due_date) : "") : ""]; })),

    ]};

function modelText(md){
  const out = [md.title.toUpperCase(), md.subtitle];
  md.sections.forEach(s => { out.push("", s.heading.toUpperCase()); if(s.columns){ if(!s.rows.length) out.push("None"); s.rows.forEach(r => out.push("- "+r.filter(v => v !== "" && v != null).join(" | "))); } else out.push(s.text || "None"); });
  return out.join("\n");
}

async function exportPDF(md){
  await need("jspdf"); await need("autotable");
  const {jsPDF} = window.jspdf, doc = new jsPDF({unit:"pt", format:"a4"});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 40;
  let y = 56;
  const room = n => { if(y + n > H - 50){ doc.addPage(); y = 56; } };
  doc.setFont("times","bold"); doc.setFontSize(18); doc.splitTextToSize(md.title, W-2*M).forEach(l => { doc.text(l, M, y); y += 22; });
  doc.setFont("times","normal"); doc.setFontSize(11); doc.splitTextToSize(md.subtitle, W-2*M).forEach(l => { doc.text(l, M, y); y += 14; });
  y += 10;
  for(const s of md.sections){
    room(40);
    doc.setFont("times","bold"); doc.setFontSize(13); doc.text(s.heading+(s.rows ? " ("+s.rows.length+")" : ""), M, y); y += 10;
    if(s.columns){
      if(!s.rows.length){ doc.setFont("times","normal"); doc.setFontSize(11); y += 6; doc.text("None", M, y); y += 20; continue; }
      doc.autoTable({startY:y, head:[s.columns], body:s.rows.map(r => r.map(v => String(v ?? ""))), theme:"grid", margin:{left:M, right:M},
        styles:{font:"times", fontSize:10, cellPadding:4, lineColor:[0,0,0], lineWidth:0.5, textColor:[0,0,0], valign:"top"},
        headStyles:{fillColor:[176,97,63], textColor:[255,255,255], fontStyle:"bold"}});
      y = doc.lastAutoTable.finalY + 22;
    } else {
      doc.setFont("times","normal"); doc.setFontSize(11); y += 6;
      doc.splitTextToSize(s.text || "None", W-2*M).forEach(l => { room(14); doc.text(l, M, y); y += 14; });
      y += 10;
    }
  }
  const n = doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("times","normal"); doc.setFontSize(9); doc.text(APP_NAME+", "+fmtLong(todayStr()), M, H-24); doc.text("Page "+i+" of "+n, W-M, H-24, {align:"right"}); }
  doc.save(md.file+".pdf");
}
async function exportXLSX(md){
  await need("xlsx");
  const X = window.XLSX, wb = X.utils.book_new(), used = new Set();
  const name = h => { let n = h.replace(/[\[\]:*?\/\\]/g,"").slice(0,28) || "Sheet", b = n, i = 2; while(used.has(n)) n = b.slice(0,25)+" "+(i++); used.add(n); return n; };
  const sheetOf = aoa => { const ws = X.utils.aoa_to_sheet(aoa); const widths = []; aoa.forEach(r => r.forEach((v,i) => { widths[i] = Math.min(60, Math.max(widths[i]||8, String(v ?? "").split("\n")[0].length + 2)); })); ws["!cols"] = widths.map(w => ({wch:w})); return ws; };
  const summary = [[md.title],[md.subtitle],["Generated", fmtDT(nowISO())],[]];
  md.sections.filter(s => s.columns).forEach(s => summary.push([s.heading, s.rows.length+" rows"]));
  X.utils.book_append_sheet(wb, sheetOf(summary), name("Summary"));
  const texts = md.sections.filter(s => !s.columns);
  if(texts.length) X.utils.book_append_sheet(wb, sheetOf([["Section","Content"], ...texts.map(s => [s.heading, s.text || "None"])]), name("Text sections"));
  md.sections.filter(s => s.columns).forEach(s => X.utils.book_append_sheet(wb, sheetOf([s.columns, ...s.rows]), name(s.heading)));
  X.writeFile(wb, md.file+".xlsx");
}
async function runExport(kind){
  const md = S.report; if(!md) return;
  try{ toast("Preparing "+(kind === "pdf" ? "PDF" : "Excel file")); await (kind === "pdf" ? exportPDF(md) : exportXLSX(md)); }
  catch(e){ toast("Could not create the "+(kind === "pdf" ? "PDF" : "Excel file")+": "+e.message+(kind === "pdf" ? " You can still use Print and choose Save as PDF." : ""), "danger", 8000); }
}
