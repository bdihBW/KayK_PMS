  week(n){ S.ui.week = n === 0 ? weekStart(todayStr()) : addDays(S.ui.week || weekStart(todayStr()), n); render(); },
  editReminder(id){ App.edit("reminders", id); },
  async reminderDone(id){ const r = byId("reminders", id); if(r.recurrence && r.recurrence !== "none"){ await saveRec("reminders", {...r, remind_at:nextOccurrence(r.remind_at, r.recurrence)}, {summary:"Done, next on "+fmtDT(nextOccurrence(r.remind_at, r.recurrence))}); } else await saveRec("reminders", {...r, done:true}, {summary:"Marked done"}); render(); },
  async snooze(id){ const r = byId("reminders", id); const d = new Date(); d.setDate(d.getDate()+1); d.setHours(8,0,0,0); await saveRec("reminders", {...r, remind_at:d.toISOString()}, {summary:"Snoozed to "+fmtDT(d.toISOString())}); toast("Moved to tomorrow 08:00"); render(); },
  async setMeetingStatus(id, s){ const m = byId("meetings", id); await saveRec("meetings", {...m, status:s}); render(); },
  async quickCapture(e, table){
    e.preventDefault(); const inp = $("#qc"); const v = inp.value.trim();
    if(!v){ inp.focus(); toast("Type something to capture first.", "warn"); return; }
    if(table === "timesheet"){ openForm("timesheet", {}, {activity:v}); inp.value = ""; return; }
    const saved = await saveRec(table, table === "tasks" ? {title:v, status:"not-started", priority:"medium"} : {title:v.slice(0,120), body:v, kind:"note"});
    toast(table === "tasks" ? "Task captured" : "Note captured", "", 3000, table === "tasks" ? {label:"Add details", fn:() => App.edit("tasks", saved.id)} : null); render(); setTimeout(() => $("#qc")?.focus(), 30);
  },
  minutesInput(){ const s = $("#min-status"); if(s) s.textContent = "Saving"; clearTimeout(S.mt); S.mt = setTimeout(flushMinutes, 1200); },
  trackTA(el){ S.lastTA = el.id; },
  selectionToTask(id){
    flushMinutes();
    const m = byId("meetings", id), ta = document.getElementById(S.lastTA) || document.getElementById("m-notes");
    const sel = ta ? ta.value.slice(ta.selectionStart, ta.selectionEnd).trim() : "";
    if(!sel){ toast("Select some text in the minutes first.", "warn"); return; }
    openForm("tasks", {}, {title:sel.replace(/\s+/g," ").slice(0,200), description:"From meeting: "+m.title+(m.date ? ", "+fmtDate(m.date) : ""), meeting_id:id, project_id:m.project_id || null, due_date:findDate(sel) || null});
  },
  extract(id){
    flushMinutes();
    const m = byId("meetings", id);
    S.draft = {meetingId:id, items:extractActions([m.notes, m.decisions, m.questions].filter(Boolean).join("\n")), label:"Draft, not confirmed", source:"Rule based extraction from these minutes. No AI service was used. Check every line before accepting."};
    showDraft();
  },
  async aiMinutes(id){
    flushMinutes(); const m = byId("meetings", id);
    try{
      const res = await aiCall({task:"extract_actions", meeting:{title:m.title, date:m.date, notes:m.notes, decisions:m.decisions, questions:m.questions}});
      S.draft = {meetingId:id, items:(res.actions||[]).map(a => ({title:a.title, due:a.due_date||""})), label:"AI draft, not confirmed", source:"Drafted by the connected AI service from these minutes."};
      showDraft();
    }catch(e){ toast(e.message, "danger", 6000); }
  },
  async acceptDraft(){
    const d = S.draft; if(!d) return; const m = byId("meetings", d.meetingId); let n = 0;
    for(let i=0;i<d.items.length;i++){ if(!$("#dr"+i)?.checked) continue; const title = $("#drt"+i).value.trim(); if(!title) continue; await saveRec("tasks", {title, status:"not-started", priority:"medium", due_date:$("#drd"+i).value || null, meeting_id:d.meetingId, project_id:m?.project_id || null, description:"Action from meeting: "+(m?.title||"")}, {summary:"Created from meeting minutes, confirmed by you"}); n++; }
    S.draft = null; toast(n+" action"+(n === 1 ? "" : "s")+" added"); render();
  },
  discardDraft(){ S.draft = null; const el = $("#draft"); if(el) el.innerHTML = ""; },
  search(e){ e.preventDefault(); const q = new FormData(e.target).get("q").trim(); location.hash = "#/search/"+encodeURIComponent(q); },
  async ask(e){
    e.preventDefault(); const q = $("#askq").value.trim(); const out = $("#askout"); if(!q) return;
    const res = rank(q).slice(0,8);
    let html = '<h3 class="small" style="margin:16px 0 4px">Matching records</h3><div class="card">'+listOr(res, x => resultRow(x, q), "Nothing in your records matches that question.")+'</div>';
    if(CONFIG.AI_ENDPOINT && res.length){
      out.innerHTML = html+'<p class="small muted">Asking the AI service</p>';
      try{
        const a = await aiCall({task:"answer", question:q, records:res.map(x => ({type:ENTITY_WORD[x.t], id:x.r.id, title:recTitle(x.r), text:x.tx.slice(0,1500)}))});
        const srcs = (a.sources || res.map(x => x.r.id)).map(id => res.find(x => x.r.id === id)).filter(Boolean);
        html = '<div class="draft"><div class="draft-head"><span>AI draft, not confirmed</span></div><div class="pre">'+esc(a.answer||"")+'</div><div class="small muted" style="margin-top:12px">From: '+(srcs.length ? srcs.map(x => '<a href="javascript:void 0" onclick="'+openJS(x.t, x.r)+'">'+esc(recTitle(x.r))+'</a>').join(", ") : "No source records found")+'</div></div>'+html;
      }catch(err){ html = '<div class="banner err">'+esc(err.message)+'</div>'+html; }
    }
    out.innerHTML = html;
  },
  pinKey(k){ const i = $("#lg-pin"); if(!i) return; if(k === "back") i.value = i.value.slice(0,-1); else if(k === "clear") i.value = ""; else if(i.value.length < 8) i.value += k; i.focus(); },
  async pinSubmit(e){
    e.preventDefault();
    const msg = $("#lg-msg"), pin = $("#lg-pin").value.trim();
    const user = S.locked && S.me ? S.me.username : ($("#lg-user")?.value || "").trim().toLowerCase();
    S.login.user = user;
    if(!user){ msg.textContent = "Enter your username."; $("#lg-user")?.focus(); return; }
    if(!/^\d{4,8}$/.test(pin)){ msg.textContent = "Enter your PIN, 4 to 8 digits."; $("#lg-pin").focus(); return; }
    const btn = e.target.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "Checking";
    try{
      const p = S.mode === "local" ? await localLogin(user, pin) : await supaLogin(user, pin);
      S.login = {user:"", msg:""}; enterWorkspace(p);
    }catch(err){ S.login.msg = err.message; render(); setTimeout(() => $("#lg-pin")?.focus(), 30); }
  },
  lock(){ if(!S.me) return; flushMinutes(); closeSheet(); S.locked = true; render(); setTimeout(() => $("#lg-pin")?.focus(), 30); },
  async signOut(){
    flushMinutes(); closeSheet();
    if(S.mode === "supabase" && S.client) await S.client.auth.signOut().catch(() => {});
    S.me = null; S.locked = false; S.user = null; S.userList = null; S.sample = null;
    S.data = emptyData(); S.login = {user:"", msg:""}; location.hash = "#/home"; render(); setTimeout(() => $("#lg-user")?.focus(), 30);
  },
  addUserForm(){ sheetForm("Add a user", '<div class="field wide"><label for="u-name">Full name</label><input class="input" id="u-name" autocomplete="off"></div><div class="field"><label for="u-user">Username</label><input class="input" id="u-user" autocapitalize="none" autocomplete="off" spellcheck="false"><div class="hint">They type this to sign in, for example neo.m</div></div><div class="field"><label for="u-title">Job title</label><input class="input" id="u-title" autocomplete="off"><div class="hint">Shown on their reports</div></div>'+pinFields("u-pin")+'<p class="small muted wide" style="margin:0">They get their own empty workbench and a standard account. Give them the username and PIN in person, not by email.</p>', "Create account", "App.createUser()"); },
  async createUser(){
    const full_name = $("#u-name").value.trim(), username = $("#u-user").value.trim().toLowerCase(), job_title = $("#u-title").value.trim(), pin = $("#u-pin1").value, pin2 = $("#u-pin2").value;
    if(!full_name) return formErr("Enter their full name.");
    const up = usernameProblem(username); if(up) return formErr(up);
    const pp = pinProblem(pin, pin2); if(pp) return formErr(pp);
    try{ await App.userAction("create", {full_name, username, job_title, pin}, true); closeSheet(); toast("Account created for "+full_name); }catch(e){ formErr(e.message); }
  },
  resetPinForm(id){ const u = (S.userList||[]).find(x => x.id === id); sheetForm("Reset PIN for "+(u?.full_name||"user"), pinFields("r-pin")+'<p class="small muted wide" style="margin:0">This also clears any lockout. Tell them the new PIN in person.</p>', "Set new PIN", "App.resetPin('"+id+"')"); },
  async resetPin(id){ const pin = $("#r-pin1").value, pp = pinProblem(pin, $("#r-pin2").value); if(pp) return formErr(pp); try{ await App.userAction("reset_pin", {id, pin}, true); closeSheet(); toast("PIN reset"); }catch(e){ formErr(e.message); } },
  deleteUserForm(id){ const u = (S.userList||[]).find(x => x.id === id); if(!u) return; sheetForm("Delete "+u.full_name+"?", '<p class="wide" style="margin:0">This deletes their account <b>and their whole workbench</b>: tasks, meetings, timesheets, notes and briefcase files. It cannot be undone. If they might come back, switch the account off instead.</p><div class="field wide"><label for="del-confirm">Type <b>'+esc(u.username)+'</b> to confirm</label><input class="input" id="del-confirm" autocapitalize="none" autocomplete="off"></div>', "Delete account and workbench", "App.deleteUser('"+id+"')"); $("#sheet-root [type=submit]").className = "btn btn-danger"; },
  async deleteUser(id){ const u = (S.userList||[]).find(x => x.id === id); if(!u) return; if($("#del-confirm").value.trim().toLowerCase() !== u.username) return formErr("Type the username exactly to confirm."); try{ await App.userAction("delete", {id}, true); closeSheet(); toast("Account and workbench deleted"); }catch(e){ formErr(e.message); } },
  async userAction(action, payload, throwErr){
    try{
      if(!isAdmin()) throw new Error("Only the administrator can manage users.");
      if(S.mode === "local"){
        if(action === "create"){
          if(S.users.some(u => u.username === payload.username)) throw new Error("That username is already taken.");
          S.users.push({id:uid(), full_name:payload.full_name, username:payload.username, job_title:payload.job_title||"", role:"user", pin_hash:await pinHash(payload.username, payload.pin), disabled:false, failed:0, locked_until:null, created_at:nowISO(), last_login:null});
        } else {
          const u = S.users.find(x => x.id === payload.id); if(!u) throw new Error("User not found.");
          if(u.id === S.me.id) throw new Error("You cannot change your own account here.");
          if(action === "reset_pin"){ u.pin_hash = await pinHash(u.username, payload.pin); u.failed = 0; u.locked_until = null; }
          if(action === "set_disabled") u.disabled = payload.disabled;
          if(action === "delete"){ S.users = S.users.filter(x => x.id !== u.id); delete S.workspaces[u.id]; delete S.samples[u.id]; }
        }
      } else {
        const call = {create:["admin_create_user", {p_username:payload.username, p_full_name:payload.full_name, p_job_title:payload.job_title || "", p_pin:payload.pin}],
          reset_pin:["admin_reset_pin", {p_user:payload.id, p_pin:payload.pin}], set_disabled:["admin_set_disabled", {p_user:payload.id, p_disabled:payload.disabled}],
          delete:["admin_delete_user", {p_user:payload.id}]}[action];
        const {error} = await S.client.rpc(call[0], call[1]); if(error) throw new Error(error.message);
      }
      if(S.mode === "local") localEvent({create:"user_created", reset_pin:"pin_reset", set_disabled:payload.disabled ? "user_disabled" : "user_enabled", delete:"user_deleted"}[action], payload.username || (S.users.find(x => x.id === payload.id)||{}).username || "", payload.id || null);
      if(action === "set_disabled") toast(payload.disabled ? "Account switched off. They cannot sign in." : "Account switched on");
      S.userList = null; render();
    }catch(e){ if(throwErr) throw e; toast(e.message, "danger", 6000); }
  },
  changePinForm(){ sheetForm("Change my PIN", '<div class="field wide"><label for="c-cur">Current PIN</label><input class="input pin-input" id="c-cur" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password"></div>'+pinFields("c-new"), "Change PIN", "App.changePin()"); },
  async changePin(){
    const cur = $("#c-cur").value, pin = $("#c-new1").value, pp = pinProblem(pin, $("#c-new2").value);
    if(!cur) return formErr("Enter your current PIN."); if(pp) return formErr(pp);
    try{
      if(S.mode === "local"){ const u = S.users.find(x => x.id === S.me.id); if(await pinHash(u.username, cur) !== u.pin_hash) throw new Error("Your current PIN is wrong."); u.pin_hash = await pinHash(u.username, pin); }
      else { const {error} = await S.client.rpc("change_my_pin", {p_current:cur, p_new:pin}); if(error) throw new Error(error.message); }
      closeSheet(); toast("PIN changed. Use the new one next time.");
    }catch(e){ formErr(e.message); }
  },
  dropFiles(files, metaJson){ let meta = {}; try{ meta = JSON.parse(metaJson || "{}"); }catch(e){} Object.keys(meta).forEach(k => { if(meta[k] == null) delete meta[k]; }); if(files && files.length) quickUpload(files, meta); },
  photoNotes(files, mid){ const m = byId("meetings", mid); if(!files || !files.length) return; quickUpload(files, {meeting_id:mid, project_id:m?.project_id || null, folder:"Meeting notes", doc_date:m?.date || todayStr()}, {photo:true, title:"Notes, "+(m?.title || "meeting")}); },
  weekExport(fmt){ S.report = weekModel(S.ui.week || weekStart(todayStr())); runExport(fmt); },
  report(kind, arg){
    const md = kind === "week" ? weekModel(arg || $("#rp-week").value || todayStr())
      : kind === "period" ? periodModel($("#rp-from").value || addDays(todayStr(),-6), $("#rp-to").value || todayStr())
      : kind === "outstanding" ? outstandingModel($("#rp-proj")?.value || "")
      : kind === "portfolio" ? portfolioModel()
      : kind === "project" ? projectModel(arg || $("#rp-one").value)
      : kind === "minutes" ? (flushMinutes(), minutesModel(arg))
      : workbookModel();
    if(kind === "period" && $("#rp-from").value > $("#rp-to").value) return toast("The start date must be before the end date.", "warn");
    reportSheet(md);
  },
  async quickExport(kind, fmt){ S.report = kind === "workbook" ? workbookModel() : null; await runExport(fmt); },
  reportPDF(){ runExport("pdf"); },
  reportXLSX(){ runExport("xlsx"); },
  copyReport(){ navigator.clipboard?.writeText(S.report ? modelText(S.report) : "").then(() => toast("Copied"), () => toast("Copy failed. Select the text instead.", "warn")); },
  printReport(){ document.body.classList.add("printing"); setTimeout(() => { window.print(); document.body.classList.remove("printing"); }, 50); },
  exportJSON(){ const data = {}; TABLES.forEach(t => data[t] = T(t).map(strip)); download("kayk-workbench-backup-"+todayStr()+".json", JSON.stringify({app:"kayk-workbench", version:1, exported_at:nowISO(), data}, null, 2)); toast("Backup downloaded"); },
  exportCSV(t){ const cols = t === "timesheet" ? ["entry_date","start_time","end_time","hours","activity","category","project"] : t === "tasks" ? ["title","status","priority","due_date","follow_up_date","project","blocked_reason","description","created_at","completed_at"] : ["title","date","start_time","type","project","location","attendees","decisions","questions","status"]; download("kayk-"+t+"-"+todayStr()+".csv", csv(T(t).map(r => ({...r, project:projName(r.project_id)})), cols), "text/csv"); },
  async importJSON(file){
    if(!file) return;
    try{
      if(file.size > 20*1048576) throw new Error("The backup file is larger than 20 MB.");
      const j = JSON.parse(await file.text()); const data = j.data || j; let n = 0, skipped = 0;
      const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      const REFS = ["id","project_id","meeting_id","task_id","entity_id","related_id"];
      for(const t of TABLES){ for(const r of (Array.isArray(data[t]) ? data[t] : [])){ if(!r || typeof r !== "object" || REFS.some(k => r[k] != null && !UUID.test(String(r[k])))){ skipped++; continue; } const rr = {}; for(const [k,v] of Object.entries(r)){ if(k === "user_id" || k.startsWith("_") || k === "__proto__" || k === "constructor") continue; rr[k] = typeof v === "string" ? v.slice(0, 50000) : v; } if(S.mode === "supabase"){ const {error} = await S.client.from(t).upsert(rr); if(error) throw error; } const arr = T(t); const i = arr.findIndex(x => x.id === rr.id); if(i >= 0) arr[i] = rr; else arr.push(rr); n++; } }
      if(S.mode === "supabase") await loadAll();
      toast(n+" records restored"+(skipped ? ", "+skipped+" rejected as unsafe" : "")); render();
    }catch(e){ toast("Could not restore: "+e.message, "danger", 6000); }
  },
  async connect(e){
    e.preventDefault(); const url = $("#c-url").value.trim(), key = $("#c-key").value.trim();
    if(!/^https:\/\/.+/.test(url) || key.length < 20) return toast("Enter the project URL and the anon key from Supabase.", "warn");
    try{ CONFIG.SUPABASE_URL = url; CONFIG.SUPABASE_ANON_KEY = key; await connectSupabase(url, key); S.me = null; render(); toast("Connected. Sign in with your Supabase account."); }catch(err){ S.mode = "local"; toast(err.message, "danger", 6000); }
  },
  async copyLocal(){
    if(!S.localCopy) return; let n = 0;
    try{
      for(const t of TABLES){ const rows = (S.localCopy[t] || []).map(r => { const o = strip(r); delete o.user_id; return o; }); if(rows.length){ const {error} = await S.client.from(t).upsert(rows); if(error) throw error; n += rows.length; } }
      S.localCopy = null; await loadAll(); toast(n+" records copied to Supabase"); render();
    }catch(e){ toast(e.message, "danger", 6000); }
  },
  enableNotifications(){ if(!("Notification" in window)) return toast("This browser does not support notifications.", "warn"); Notification.requestPermission().then(p => { toast(p === "granted" ? "Notifications allowed" : "Notifications not allowed", p === "granted" ? "" : "warn"); render(); }); },
  theme(k){ if(k === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = k; render(); }
};
window.App = App;
function refreshFab(){ const f = $("#fab"); if(f) f.outerHTML = fabHTML(); }
function refreshNew(){ const w = $("#newwrap"); if(!w) return; w.querySelector(".newmenu")?.remove(); if(S.ui.newMenu) w.insertAdjacentHTML("beforeend", newMenuHTML()); w.querySelector(".btn-primary").setAttribute("aria-expanded", !!S.ui.newMenu); }
let gPending = false;
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ if(S.ui.newMenu){ S.ui.newMenu = false; refreshNew(); } if(S.ui.qa){ S.ui.qa = false; refreshFab(); } return; }
  if(!S.me || S.locked) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if(["input","textarea","select"].includes(tag) || e.target.isContentEditable || $("#sheet-root").innerHTML) return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); App.focusSearch(); return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if(gPending){ gPending = false; const to = {d:"home",t:"tasks",s:"timesheet",r:"reports",p:"projects",m:"meetings"}[k]; if(to){ location.hash = "#/"+to; e.preventDefault(); } return; }
  if(k === "/"){ e.preventDefault(); App.focusSearch(); }
  else if(k === "n"){ e.preventDefault(); App.add("tasks"); }
  else if(k === "l"){ e.preventDefault(); App.add("timesheet"); }
  else if(k === "m"){ e.preventDefault(); App.add("meetings"); }
  else if(k === "g"){ gPending = true; setTimeout(() => gPending = false, 1200); }
  else if(e.key === "?"){ App.shortcuts(); }
});
document.addEventListener("click", e => { if(S.ui.newMenu && !e.target.closest("#newwrap")){ S.ui.newMenu = false; refreshNew(); } });
async function aiCall(payload){
  const headers = {"Content-Type":"application/json"};
  if(S.mode === "supabase"){ const {data} = await S.client.auth.getSession(); if(data.session) headers.Authorization = "Bearer "+data.session.access_token; headers.apikey = CONFIG.SUPABASE_ANON_KEY; }
  const r = await fetch(CONFIG.AI_ENDPOINT, {method:"POST", headers, body:JSON.stringify(payload)});
  if(!r.ok) throw new Error("The AI service returned "+r.status+".");
  return r.json();
}

/* ---------- boot ---------- */
(async function boot(){
  const host = location.hostname;
  if(location.protocol === "http:" && host !== "localhost" && host !== "127.0.0.1"){ location.replace("https:"+location.href.slice(5)); return; }
  if(window.top !== window.self && /\.github\.io$/.test(host)){ document.body.innerHTML = '<p style="font:16px system-ui;padding:24px">For your security KayK Workbench cannot be shown inside another site. <a href="'+esc(location.href)+'" target="_top" rel="noopener">Open it directly</a>.</p>'; return; }
  window.addEventListener("hashchange", render);
  $("#app").innerHTML = '<div class="login"><div class="muted">Loading</div></div>';
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY){
    try{ await connectSupabase(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY); }
    catch(e){ S.mode = "local"; S.client = null; S.bootError = "Could not reach Supabase ("+e.message+"). Working in local mode."; }
  }
  if(S.mode === "local") seedLocalAdmin();
  S.loaded = true;
  ["pointerdown","keydown","touchstart","wheel"].forEach(ev => document.addEventListener(ev, () => { S.lastActive = Date.now(); }, {passive:true}));
  setInterval(() => { if(S.me && !S.locked && Date.now() - S.lastActive > IDLE_LOCK_MIN*60000) App.lock(); }, 30000);
  render();
  setTimeout(() => (S.me ? null : $("#lg-user"))?.focus(), 50);
  checkReminders();
  setInterval(checkReminders, 30000);

})();
</script>
